services:
  api:
    build:
      context: .
      target: runtime
    image: sentiment-mlops-api:latest
    environment:
      SENTIMENT_CORS_ORIGINS: ${SENTIMENT_CORS_ORIGINS:-http://localhost:8000}
      SENTIMENT_MODEL_VERSION: ${SENTIMENT_MODEL_VERSION:-1.0.0}
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9080:9090"]
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-before-deploy}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3001:3000"]
    restart: unless-stopped
    depends_on: [prometheus]

volumes:
  prometheus-data:
  grafana-data:
