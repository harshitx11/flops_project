name: CI
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Lint with ruff
        run: uv run ruff check .
      - name: Run unit tests
        run: uv run pytest
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --target runtime -t sentiment-mlops-api:ci .
      - name: Smoke test the image
        run: |
          docker run -d --name api -p 8000:8000 sentiment-mlops-api:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/ready && break; sleep 2; done
          curl -fs -X POST http://127.0.0.1:8000/predict -H 'Content-Type: application/json' -d '{"text":"I love it"}'
          docker rm -f api
