[project]
name = "sentiment-mlops"
version = "0.1.0"
description = "End-to-end MLOps review sentiment classifier"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
	"fastapi==0.115.6",
	"joblib==1.4.2",
	"numpy==2.2.1",
	"pandas==2.2.3",
	"prometheus-client==0.21.1",
	"pydantic-settings==2.7.1",
	"scikit-learn==1.6.1",
	"uvicorn==0.34.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
	"httpx==0.28.1",
	"pytest==8.3.4",
	"ruff==0.9.2",
]

[project.scripts]
download-data = "sentiment_mlops.data.download_data:main"
train-model = "sentiment_mlops.models.train:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:scipy.optimize:DeprecationWarning", "ignore:The anyio.abc.BlockingPortal:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
